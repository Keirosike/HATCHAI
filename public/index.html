
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HATCHAI Notifications</title>

  <style>
    body {
      font: 16px/1.6 system-ui;
      background: #f3f6fa;
      color: #172b3a;
      margin: 0;
    }

    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
    }

    button {
      padding: 12px 16px;
      min-height: 44px;
      margin: 12px 8px 0 0;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #1466cc;
    }

    #status {
      padding: 16px;
      background: #edf4fa;
      overflow-wrap: anywhere;
    }

    #copyToken {
      background: #1466cc;
      color: white;
      border: none;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      main {
        margin: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>HATCHAI Chick Alerts</h1>

    <p>
      Receive notifications when the ESP32-S3 camera
      detects a newly hatched chick inside your incubator.
    </p>

    <h3>Push Notifications</h3>

    <button id="enable" type="button">
      Enable Notifications
    </button>

    <button id="disable" type="button">
      Disable Notifications
    </button>

    <button id="copyToken" type="button">
      Copy FCM Token
    </button>

    <p id="status" role="status" aria-live="polite">
      Checking HATCHAI notification registration...
    </p>

    <p>
      Notifications are registered automatically when
      browser permission has already been granted.
    </p>
  </main>

  <script type="module" src="push.js"></script>

  <script>
    document.getElementById('copyToken')
      .addEventListener('click', async () => {

        const token =
          localStorage.getItem('hatchaiPushToken');

        if (!token) {
          alert(
            'No FCM token found. Enable notifications first.'
          );
          return;
        }

        try {
          await navigator.clipboard.writeText(token);

          alert('FCM token copied successfully!');

        } catch (error) {
          console.error('Copy failed:', error);

          alert('Unable to copy FCM token.');
        }
      });
  </script>
</body>
</html>
