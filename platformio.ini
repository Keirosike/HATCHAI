; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
; Optimize across application and Arduino translation units without changing SDKs.
build_flags = -flto
extra_scripts = post:scripts/firmware_lto.py
; Browser/Worker native Web Push replaces the retired controller pairing client.
; Keep its source for reference/tests, but exclude its TLS, task and credentials.
build_src_filter = +<*> -<Notification*.cpp> -<Sht40Sensor.cpp> +<NotificationPairingProtocol.cpp> +<NotificationHttpParser.cpp> +<NotificationTransportResult.cpp> +<NotificationUtcClock.cpp>
lib_deps =
    bblanchon/ArduinoJson@6.21.5
